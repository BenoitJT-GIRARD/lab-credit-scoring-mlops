<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreditExp | Visionneuse d'Artefacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --topbar-bg: rgba(22, 27, 34, 0.8);
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #238636;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 72px;
      background-color: var(--topbar-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
      z-index: 100;
    }

    .info {
      display: flex;
      flex-direction: column;
    }

    .info h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    .info span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background-color: #2ea043;
      transform: translateY(-1px);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text-bright);
      background-color: rgba(33, 38, 45, 0.5);
    }

    .btn-outline:hover {
      background-color: #30363d;
    }

    .viewer-content {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px;
      background-image:
        radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
      background-size: 40px 40px;
      background-color: #010409;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .error-msg {
      text-align: center;
    }

    .error-msg h2 { color: #f85149; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="info">
      <h1 id="title">Chargement...</h1>
      <span id="filename">---</span>
    </div>
    <div class="actions">
      <a href="#" id="raw-link" target="_blank" class="btn btn-outline">Ouvrir l'image brute</a>
      <a href="../presentation.html" id="back-link" class="btn btn-primary">Retour au Cockpit</a>
    </div>
  </div>

  <div class="viewer-content" id="content">
    <img id="main-img" src="" alt="Aperçu" style="display: none;">
    <div id="error" class="error-msg" style="display: none;">
      <h2>Artefact Introuvable</h2>
      <p>L'élément demandé n'existe pas ou le chemin est incorrect.</p>
    </div>
  </div>

  <script>
    const catalog = {
      'history': { title: 'Historique des versions Git', img: '01_github_history.png' },
      'ci': { title: 'Succès des Pipelines CI (GitHub Actions)', img: '02_github_actions_success.png' },
      'registry': { title: 'MLflow Model Registry', img: '11_mlflow_registry_model_v2.png' },
      'swagger': { title: 'Documentation Interactive API (Swagger)', img: '03_fastapi_docs.png' },
      'response': { title: 'Payload de Réponse API (Score & Décision)', img: '04_fastapi_predict_response.png' },
      'db-local': { title: 'Journalisation PostgreSQL (Local)', img: '07_postgres_predictions.png' },
      'db-cloud': { title: 'Journalisation Supabase (Cloud)', img: '14_supabase_predictions.png' },
      'ui-scoring': { title: 'Interface Client Streamlit (Scoring)', img: '05_streamlit_scoring.png' },
      'ui-monitoring': { title: 'Interface Monitoring Streamlit (Business)', img: '06_streamlit_monitoring.png' },
      'ops-prometheus': { title: 'Statut des cibles Prometheus', img: '08_prometheus_target_up.png' },
      'ops-grafana': { title: 'Dashboard de Performance Grafana', img: '09_grafana_dashboard.png.png' },
      'drift-report': { title: 'Rapport de Data Drift Evidently AI', img: '10_evidently_drift_report.png' },
      'perf-bench': { title: 'Analyse de Performance & Benchmarks', img: '12_performance_notebook.png' },
      'perf-onnx': { title: 'Résultats Optimisation ONNX', img: '13_onnx_benchmark_json.png' },
      'deploy-hf': { title: 'Déploiement Continu vers Hugging Face', img: '17_github_action_deploy_hf_success.png' },
      'coverage': { title: 'Rapport de Couverture des Tests', img: '18_pytest_coverage.png' },
      'hf-ui': { title: 'Application Streamlit sur Hugging Face', img: '15_huggingface_space_streamlit.png' },
      'remote-sync': { title: 'Synchronisation Cloud Supabase / HF', img: '19_supabase_prediction_from_hf.png' }
    };

    function load() {
      // Analyse du hash : #slug&from=slideId
      const fullHash = window.location.hash.replace('#', '');
      const parts = fullHash.split('&');
      const slug = parts[0];

      // Extraction du paramètre 'from'
      let from = 'intro';
      parts.forEach(p => {
        if (p.startsWith('from=')) from = p.split('=')[1];
      });

      const item = catalog[slug];

      if (item) {
        document.title = 'CreditExp | ' + item.title;
        document.getElementById('title').innerText = item.title;
        document.getElementById('filename').innerText = 'reports/screenshots/' + item.img;

        const img = document.getElementById('main-img');
        img.src = '../screenshots/' + item.img;
        img.style.display = 'block';

        document.getElementById('raw-link').href = '../screenshots/' + item.img;
        document.getElementById('back-link').href = '../presentation.html#' + from;
        document.getElementById('error').style.display = 'none';
      } else {
        document.getElementById('title').innerText = 'Artefact inconnu';
        document.getElementById('main-img').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('back-link').href = '../presentation.html#' + from;
      }
    }

    window.addEventListener('hashchange', load);
    window.addEventListener('load', load);
  </script>
</body>
</html>
