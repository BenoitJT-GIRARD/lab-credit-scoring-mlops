<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreditExp | Swagger Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --topbar-bg: rgba(22, 27, 34, 0.8);
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #238636;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 72px;
      background-color: var(--topbar-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
      z-index: 100;
    }

    .info {
      display: flex;
      flex-direction: column;
    }

    .info h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    .info span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background-color: #2ea043;
      transform: translateY(-1px);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text-bright);
      background-color: rgba(33, 38, 45, 0.5);
    }

    .btn-outline:hover {
      background-color: #30363d;
    }

    .iframe-container {
      flex: 1;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="info">
      <h1>Swagger UI (Local)</h1>
      <span id="url-display">http://127.0.0.1:8000/docs</span>
    </div>
    <div class="actions">
      <a href="http://127.0.0.1:8000/docs" target="_blank" class="btn btn-outline">Ouvrir en direct</a>
      <a href="../presentation.html#api" id="back-link" class="btn btn-primary">Retour au Cockpit</a>
    </div>
  </div>

  <div class="iframe-container">
    <iframe src="http://127.0.0.1:8000/docs" title="Swagger UI"></iframe>
  </div>

  <script>
    function setupNavigation() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get('from');
      if (from) {
        document.getElementById('back-link').href = `../presentation.html#${from}`;
      }
    }
    window.addEventListener('load', setupNavigation);
  </script>
</body>
</html>
